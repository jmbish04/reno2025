name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Deploy to Cloudflare
        run: npx wrangler publish
